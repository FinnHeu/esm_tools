computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/esm_tools/model_codes/${general.setup_name}-${general.version}/develop/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE2ice"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/CORE2ice/"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: true
    ini_parent_exp_id: "PICTRL_CORE2ice_1650_1850"
    ini_parent_dir: "/work/ab0995/${user}/esm_tools/runtime/${general.setup_name}-${general.version}/production_OSM26/${ini_parent_exp_id}/"
    ini_parent_date: "${prev_date}"
    choose_general.run_number:
      1:
        restart_in_sources:
            par_oce_restart: "${fesom.ini_parent_dir}/run_18400101-18491231/work/fesom.1840.oce.restart/*.nc"
            par_ice_restart: "${fesom.ini_parent_dir}/run_18400101-18491231/work/fesom.1840.ice.restart/*.nc"
    namelist_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/namelists/CAVITY_TUNING/"
    namelist_changes:
        namelist.oce:
            cavity_dyn:
                cavity_a: -0.047
                cavity_ak: 0.5e-3
    time_step: 1200
    nproc: 768
    omp_num_threads: 4
    tar_binary_restarts: true
    
oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: 'cmip6'
    namelist_dir: "${fesom.ini_parent_dir}/run_18400101-18491231/work/"

oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600

xios:
    with_model: oifs
    nproc: 8
    omp_num_threads: 32

