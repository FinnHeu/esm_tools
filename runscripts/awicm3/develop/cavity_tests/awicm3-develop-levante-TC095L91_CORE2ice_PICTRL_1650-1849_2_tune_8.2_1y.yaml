general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ba1550"
    compute_time: "00:25:00"
    initial_date: "1650-01-01"
    final_date: "1651-01-01"
    base_dir: "/work/ab0995/${user}/esm_tools/runtime/${general.setup_name}-${general.version}/cavity_tests/"
    pool_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/"
    nday: 0
    nmonth: 0
    nyear: 1
    use_venv: false
