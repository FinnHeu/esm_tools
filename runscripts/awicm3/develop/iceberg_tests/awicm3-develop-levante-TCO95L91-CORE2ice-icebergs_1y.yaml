general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ab0995"
    compute_time: "02:30:00"
    initial_date: "1850-01-01"
    final_date: "1852-01-01"
    base_dir: "/work/ab0995/${user}/esm_tools/runtime/${general.setup_name}-${general.version}/iceberg_tests/"
    pool_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/"
    nday: 0
    nmonth: 0
    nyear: 1
    nstep: 0
    use_venv: false
    with_icb: true
    parallel_file_movements: 'threads'

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/esm_tools/model_codes/${general.setup_name}-${general.version}/baseline/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE2ice"
    namelist_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/namelists/TC095L91-CORE2/"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/CORE2ice/"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: false
    time_step: 900
    nproc: 128
    tar_binary_restarts: true
    
    # icebergs
    with_icb: true
    #use_icebergs: true # set to true by with_icb (fesom2.6.yaml)
    #use_icesheet_coupling: true # set to true by with_icb (fesom2.6.yaml)
    #update_icebergs: true # set to true by with_icb (fesom2.6.yaml)
    icb_input_type: "fesom"
    mesh_diag_file: "${mesh_dir}/fesom.mesh.diag.nc"
    ini_disch_file: "/work/ab0995/a270186/esm_tools/plugins/fesom_icb_pism_fork/file_templates/fw.fesom.1869.nc"
    ini_iceberg_dir: "/work/ab0995/a270186/esm_tools/plugins/fesom_icb_pism_fork/tests/iceberg_output/"
    scaling_factor: [1, 1, 1, 1, 1, 1]
    basin_file: "/work/ab0995/a270186/esm_tools/plugins/fesom_icb_pism_fork/file_templates/antarctica.16km.nc"
    domain: "sh"
    ibareamax: 400
    use_cav: true
    #namelists
    namelist_changes:
        namelist.config:
            icebergs:
                use_icebergs: true
                lverbose_icb: true
    add_namelist_changes:
        namelist.config:
            icebergs:
                turn_off_fw: false
                turn_off_hf: false

oifs:
    resolution: "TCO95"
    levels: "L91"
    namelist_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/namelists/TC095L91-CORE2/"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 128
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850
                CMIP6DATADIR: "/work/ab0995/a270186/model_inputs/awicm3/pool/oifs-48r1/cmip6-data/"
                
oasis3mct:
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 7200

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32

