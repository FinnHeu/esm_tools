general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ba1550"
    compute_time: "03:30:00"
    initial_date: "1650-01-01"
    final_date: "1850-01-01"
    base_dir: "/work/ab0995/${user}/esm_tools/runtime/${general.setup_name}-${general.version}/production_OSM26/"
    pool_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: false
    parallel_file_movements: 'threads'
    
computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/esm_tools/model_codes/${general.setup_name}-${general.version}/cavity/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE2ice"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/CORE2ice/"
    restart_rate: 10
    restart_unit: "y"
    restart_first: 10
    lresume: false
    ini_parent_exp_id: "SPIN_CORE2_1350-1649"
    ini_parent_dir: "${general.base_dir}/restarts_CORE2_to_CORE2ice_1649/"
    ini_parent_date: "${prev_date}"
    choose_general.run_number:
      1:
        restart_in_sources:
            par_oce_restart: "${fesom.ini_parent_dir}/fesom.1640.oce.restart/*.nc"
            par_ice_restart: "${fesom.ini_parent_dir}/fesom.1640.ice.restart/*.nc"
    
    time_step: 1200
    nproc: 768
    omp_num_threads: 4
    tar_binary_restarts: true
    
    namelist_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/namelists/TUNE42PI_FES27/baseline/"
    namelist_changes:
        namelist.config:
            run_config:
                use_cavity: true

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: 'cmip6'
    namelist_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/namelists/TUNE42PI_FES27/baseline/"

oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600

xios:
    with_model: oifs
    nproc: 8
    omp_num_threads: 32

