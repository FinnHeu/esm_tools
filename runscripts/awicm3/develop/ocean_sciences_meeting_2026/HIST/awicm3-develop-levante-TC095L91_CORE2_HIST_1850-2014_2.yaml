general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ba1550"
    compute_time: "03:00:00"
    initial_date: "1850-01-01"
    final_date: "2015-01-01"
    base_dir: "/work/ab0995/${user}/esm_tools/runtime/${general.setup_name}-${general.version}/production_OSM26/"
    pool_dir: "/work/ab0995/a270186/model_inputs/awicm3/pool/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: false
    parallel_file_movements: 'threads'
    
computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/esm_tools/model_codes/${general.setup_name}-${general.version}/baseline/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE2"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/CORE2/"
    restart_rate: 10
    restart_unit: "y"
    restart_first: 10
    lresume: true
    ini_parent_exp_id: "PICTRL_CORE2_1650_1850_2"
    ini_parent_dir: "${general.base_dir}/${ini_parent_exp_id}/"
    ini_parent_date: "${prev_date}"
    choose_general.run_number:
      1:
        restart_in_sources:
            par_oce_restart: "${fesom.ini_parent_dir}/run_18400101-18491231/work/fesom.1840.oce.restart/*.nc"
            par_ice_restart: "${fesom.ini_parent_dir}/run_18400101-18491231/work/fesom.1840.ice.restart/*.nc"
    namelist_dir: "${fesom.ini_parent_dir}/run_18400101-18491231/work/"
    time_step: 1800
    nproc: 768
    omp_num_threads: 4
    tar_binary_restarts: true
    
oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: 'cmip6'
    namelist_dir: "/work/ab0995/a270186/esm_tools/runtime/awicm3-develop/production_OSM26/SPIN_CORE2_1350-1649/run_13500101-13591231/work/"
    namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 0  #constant greenhouse gas and aerosol concentration for the year 1950 (NCMIPFIXYR: 0 for transient concentrations)
     
oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600

xios:
    with_model: oifs
    nproc: 8
    omp_num_threads: 32

