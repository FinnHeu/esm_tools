    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: 'cmip6'
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
                RCL_OVERLAPLIQICE: 0.1

            NAMGWWMS:
                GGAUSSB: -0.6

oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
