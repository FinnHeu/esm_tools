      1:
        restart_in_sources:
            par_oce_restart: "${general.ini_parent_dir}/run_16001201-16001231/work/fesom.1600.oce.restart/*.nc"
            par_ice_restart: "${general.ini_parent_dir}/run_16001201-16001231/work/fesom.1600.ice.restart/*.nc"
    
    namelist_dir: "${general.pool_dir}/namelists/TUNE42PI_FES27/"
