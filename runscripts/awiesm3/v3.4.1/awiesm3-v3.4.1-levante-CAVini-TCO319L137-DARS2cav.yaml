general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "v3.4.1"
    account: "ba1550"
    compute_time: "08:00:00"
    initial_date: "1600-01-01"
    final_date: "1612-01-01"
    base_dir: "/work/ba1550/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 2
    use_venv: False
    pool_dir: "/work/ab0246/a270092/input/" #"/work/pd1284/AWIESM/"
    force_overwrite_in_file_movements: True
