computer:
    taskset: true
    mail_type: "ALL"
    mail_user: "finn.heukamp@awi.de"

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/models/${general.setup_name}-${general.version}/"

fesom:
    resolution: "DARS2cav"
    mesh_dir : "/work/ab0995/a270186/model_inputs/fesom2/mesh/DARS2cav/"
    namelist_dir: "${general.esm_namelist_dir}/fesom2/CMIP7_HR"
    time_step: 360
    nproc: 5120
    omp_num_threads: 2
    lresume: true
    restart_rate: 2
    restart_unit: 'y'
    restart_first: 2
    ini_parent_exp_id: "foo"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "work/ba1550/a270301/model_inputs/awiesm3-v3.4.1/restarts_DARS2_to_DARS2cav/"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1599.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1599.ice.restart/*.nc

    add_namelist_changes:
        namelist.dyn:
            dynamics_general:
                ab_order: 3
        namelist.config:
            paths:
                meshpath: "/work/ab0995/a270186/model_inputs/fesom2/mesh/DARS2cav/"
            run_config:
                use_cavity: .true.
        

lpj_guess:
    resolution: "TCO319"
    mip: cmip7
    scenario: piControl
    daily_output: False
    nproc: 64
    omp_num_threads: 8
    lresume: false
    ini_parent_exp_id: "foo"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "/work/bb1469/a270089/runtime/awiesm3-v3.4.1/AWI-ESM3-VEG-HR-CMIP7-Spinup_cont1/restart/lpj_guess/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_1490/*
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    slt_dir: "/work/ba1550/a270301/model_inputs/DARS2cav/lpj-guess/"

oifs:
    resolution: "TCO319"
    levels: "L137"
    prepifs_expid: abns
    input_expid: awi3
    wam: true
    time_step: 1200
    nproc: 640
    omp_num_threads: 4
    mip: "cmip7"
    scenario: "piControl"
    lresume: false
    cmip7_cmor_output: "cmip7_spinup"
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16
            NAEPHY:
                #LRDALB: true            # Turn albedo coupling OFF
                LRDALB: false          # Turn albedo coupling OFF (ON?)
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

