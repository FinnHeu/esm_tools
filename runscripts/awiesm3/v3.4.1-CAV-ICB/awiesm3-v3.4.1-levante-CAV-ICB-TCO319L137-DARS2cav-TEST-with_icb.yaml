fesom:
    resolution: "DARS2cav"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/DARS2cav/"
    namelist_dir: "${general.esm_namelist_dir}/fesom2/CMIP7_HR"
    time_step: 360
    nproc: 5120
    omp_num_threads: 2
    lresume: true
    restart_rate: 1
    restart_unit: 'y'
    restart_first: 1
    ini_parent_exp_id: "foo"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "/work/ba1550/a270186/simulations/awiesm3-v3.4.1/preproduction/restarts/DARS2_to_DARS2cav/CAV/"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1599.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1599.ice.restart/*.nc
    
    # Icebergs
    with_icb: true
    ini_iceberg_dir: "/home/a/a270186/esm_tools/plugins/AWI-ESM-v3.4.x-CAV-ICB/test/output/"
    basin_file: "/home/a/a270186/esm_tools/plugins/basins/basins_antarctica.nc"
    use_cav: true
    scaling_factor: [100, 50, 25, 1, 1, 1]
    ibareamax: 100

    add_namelist_changes:
        namelist.dyn:
            dynamics_general:
                ab_order: 3
        namelist.config:
            paths:
                meshpath: "/work/ab0995/a270186/model_inputs/fesom2/mesh/DARS2cav/"
            run_config:
                use_cavity: .true.
            icebergs:
                #ib_num: 452
                steps_per_ib_step: 8
                cell_saturation: 4
        

