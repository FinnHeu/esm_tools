general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "v3.4.2-CAV-ICB"
    account: "ba1550"
    compute_time: "04:30:00"
    initial_date: "1850-01-01"
    final_date: "1851-01-01"
    base_dir: "/work/ba1550/a270186/simulations/awiesm3-v3.4.2-CAV-ICB/production/"
    pool_dir: "/work/ab0995/a270186/model_inputs/AWIESM3/input/"
    nday: 0
    nmonth: 6
    nyear: 0
    use_venv: False
    force_overwrite_in_file_movements: True

computer:
    taskset: true
    mail_type: "ALL"
    mail_user: "finn.heukamp@t-online.de"

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/esm_tools/model_codes/awiesm3-v3.4.2/CAV-ICB/awiesm3-v3.4.2/"

fesom:
    resolution: "DARS2cav"
    mesh_dir: "/work/ab0995/a270186/model_inputs/fesom2/mesh/DARS2cav/"
    namelist_dir: "${general.esm_namelist_dir}/fesom2/CMIP7_HR/"
    time_step: 240    #300
    nproc: 5120       #6400
    omp_num_threads: 2
    lresume: true
    restart_rate: 6
    restart_unit: 'm'
    restart_first: 6
    ini_parent_exp_id: "foo"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "/work/ba1550/a270186/simulations/awiesm3-v3.4.2-CAV-ICB/production/restarts/CAVini/"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1849.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1849.ice.restart/*.nc
    
    # Icebergs
    with_icb: false
    ini_iceberg_dir: "/work/ba1550/a270186/simulations/awiesm3-v3.4.1-CAV-ICB/preproduction/CAV-ICB-PICTRL-TEST-with_icb-7/run_16070101-16071231/work/"
    basin_file: "/home/a/a270186/esm_tools/plugins/basins/basins_antarctica.nc"
    use_cav: true
    scaling_factor: [100, 50, 25, 1, 1, 1]
    ibareamax: 100

    # Cmorization
    cmip7_cmor_output: False
    regrid_surface_output: False

    # Namelist Changes
    add_namelist_changes:
        namelist.dyn:
            dynamics_general:
                ab_order: 3
        namelist.config:
            run_config:
                use_cavity: .true.
            icebergs:
                steps_per_ib_step: 8
                cell_saturation: 4


lpj_guess:
    resolution: "TCO319"
    mip: cmip7
    scenario: piControl
    daily_output: False
    nproc: 64
    omp_num_threads: 16
    lresume: true
    ini_parent_exp_id: "foo"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "/work/ba1550/a270186/simulations/awiesm3-v3.4.2-CAV-ICB/production/restarts/lpjguess/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/*
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850

oifs:
    resolution: "TCO319"
    levels: "L137"
    prepifs_expid: abns
    input_expid: awi3
    wam: true
    time_step: 1200
    nproc: 640
    omp_num_threads: 4
    mip: "cmip7"
    scenario: "piControl"
    lresume: false
    cmip7_cmor_output: False

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3

rnfmap:
    input_dir: "/work/ba1550/a270301/model_inputs/DARS2cav/runoff_map_modified/"
